<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aletheia — Exhibition</title>
  <meta name="description" content="Aletheia: 3D visualization of biological macromolecules" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./display.css" />
</head>
<body>

  <!-- ==================================================================
       ==================================================================
       {1} CANVAS 3D
       ==================================================================
        Three.js canvas container. Occupies 100% of the viewport.
       ================================================================== -->
  <div id="canvas-container"></div>

  <!-- ==================================================================
       ==================================================================
       {2} LOADING SCREEN — PERSONALIZABLE
       ==================================================================
        Loading screen. You can freely modify ALL the HTML and CSS of this
        section. The JS only controls the .hidden class.
       ================================================================== -->
  <!-- LOADING SCREEN START -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading molecule…</p>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>
  <!-- LOADING SCREEN END -->

  <!-- ==================================================================
       ==================================================================
       {3} MOLECULE OVERLAY — PERSONALIZABLE
       ==================================================================
        Overlay with info about the current molecule. You can modify
        ALL the HTML and CSS. The JS only injects text and controls .hidden.
       ================================================================== -->
  <!-- MOLECULE OVERLAY START -->
  <div id="molecule-overlay" class="hidden">
    <h2 id="molecule-name"></h2>
    <p id="molecule-description"></p>
  </div>
  <!-- MOLECULE OVERLAY END -->

  <!-- ==================================================================
        {4} MAIN SCRIPT
       ================================================================== -->
  <script type="module" src="./display.js"></script>

</body>
</html>
