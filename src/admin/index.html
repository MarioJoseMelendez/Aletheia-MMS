<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aletheia — Admin</title>
  <meta name="description" content="Aletheia: Administration panel for macromolecules" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>

  <!-- ==================================================================
       ==================================================================
       {1} HEADER
       ================================================================== -->
  <header id="admin-header">
    <h1>Aletheia — Administration</h1>
    <p>Macromolecule management</p>
  </header>

  <!-- ==================================================================
       ==================================================================
        {2} MAIN CONTENT
       ================================================================== -->
  <main id="admin-main">

    <!-- {3} Button to add new molecule -->
    <div class="toolbar">
      <button id="add-molecule-btn" class="primary-btn">+ New Molecule</button>
    </div>

    <!-- {4} Molecules table -->
    <div class="table-container">
      <table id="molecules-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Atoms</th>
            <th>Audio</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="molecules-tbody"></tbody>
      </table>
    </div>

    <!-- {5} Create/Edit modal -->
    <div id="molecule-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 id="modal-title">New Molecule</h2>
        <form id="molecule-form">
          <div class="form-group">
            <label for="mol-name">Name</label>
            <input type="text" id="mol-name" required />
          </div>
          <div class="form-group">
            <label for="mol-description">Description</label>
            <textarea id="mol-description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="mol-category">Category</label>
            <input type="text" id="mol-category" placeholder="E.g.: Proteins, DNA, Lipids" />
          </div>
          <div class="form-group">
            <label>PDB File</label>
            <div id="pdb-dropzone" class="dropzone">
              <p>Drop your .pdb file here or click to select</p>
              <input type="file" id="mol-pdb" accept=".pdb" />
            </div>
            <p id="pdb-filename" class="file-indicator"></p>
          </div>
          <div class="form-group">
            <label>Audio File</label>
            <div id="audio-dropzone" class="dropzone">
              <p>Drop your audio file here or click to select</p>
              <input type="file" id="mol-audio" accept="audio/*" />
            </div>
            <p id="audio-filename" class="file-indicator"></p>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
            <button type="submit" id="save-btn" class="primary-btn">Save</button>
          </div>
        </form>
        <div id="upload-progress" class="hidden">
          <div class="progress-bar">
            <div id="upload-progress-fill" class="progress-fill"></div>
          </div>
          <p id="upload-status">Uploading files…</p>
        </div>
      </div>
    </div>

  </main>

  <!-- {6} Toast notifications -->
  <div id="toast-container"></div>

  <script type="module" src="./admin.js"></script>

</body>
</html>
